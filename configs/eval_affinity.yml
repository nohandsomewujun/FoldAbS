model:
  model_name: protenix_base_default_v1.0.0
  checkpoint_path: ./checkpoints/protenix_base_default_v1.0.0.pt

regression_head:
  hidden_dim: 256
  dropout: 0.1
  freeze_base: true

affinity_module:
  num_dist_bins: 64
  max_dist: 22.0
  reduce_samples: mean
  b_pae: 64
  N_sample_mini_rollout: 32
  N_step_mini_rollout: 20  

  pairformer:
    n_blocks: 4
    dropout: 0.0
    blocks_per_ckpt: null
